# The full gate (scripts/gate) as a CI fan-out (D32): one build, then one job per gate group
# (`scripts/gate --groups`); together the groups cover every step, which a full local run checks.
# Mathlib oleans come from its cache, never a rebuild. `ci/**` pushes = an agent's full gate, except
# `ci/fuzz-*` (a fuzz campaign, fuzz.yml) and `ci/mut-*` (mutation shards, mutation.yml).
name: gate

on:
  push:
    branches: [main, "ci/**", "!ci/fuzz-**", "!ci/mut-**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6 # v1.6.2
        with:
          auto-config: "false"
          use-mathlib-cache: "true"
          use-github-cache: "true"
      - name: Build
        run: lake --wfail build && lake --wfail build fvatest fvafuzz
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lake/build
          key: fva-build-${{ github.sha }}

  gate:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        group: [lean, trust, init, subjects, static]
    steps:
      # The runner image leaves ≈ 2 GB free once the Mathlib cache and the build are restored; the
      # init lane's fva init project (vendored FVA, hard-linked Mathlib, its own build) ran the
      # disk full and hung to the job timeout → drop preinstalled toolchains no step uses
      - name: Free disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans history
          persist-credentials: false
      - uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6 # v1.6.2
        if: matrix.group != 'static'
        with:
          auto-config: "false"
          use-mathlib-cache: "true"
          use-github-cache: "true"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: matrix.group != 'static'
        with:
          path: .lake/build
          key: fva-build-${{ github.sha }}
          fail-on-cache-miss: true
      # `lake check` (test-init) and fva trust's own sandbox use bwrap: absent from the image, and
      # Ubuntu 24.04's AppArmor default denies the unprivileged user namespace it needs
      - name: Sandbox
        if: matrix.group != 'static'
        run: |
          sudo apt-get install -y -qq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # D79: subjects reuse the verdicts of main's latest green subjects run (scripts/subject-matrix
      # still keys each entry by its input closure); main pushes alone save the cache, so a ci/** or
      # PR run reads it and never writes it
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: matrix.group == 'subjects'
        with:
          path: .cache/subjects
          key: fva-subjects-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: fva-subjects-
      - name: Gate
        env:
          GROUP: ${{ matrix.group }}
        run: df -h / && scripts/gate --group "$GROUP"
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: matrix.group == 'subjects' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: .cache/subjects
          key: fva-subjects-${{ github.run_id }}-${{ github.run_attempt }}
      # free space after the run (the lean lane's parallel steps write the most)
      - name: Disk
        if: always()
        run: df -h /
