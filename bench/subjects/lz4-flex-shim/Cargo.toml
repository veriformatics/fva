[package]
name = "fva-lz4-flex"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
lz4_flex = { version = "=0.14.0", path = "vendor/lz4_flex", default-features = false, features = ["safe-encode", "safe-decode", "checked-decode"] }

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
